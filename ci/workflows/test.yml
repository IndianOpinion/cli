name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Version strings agree
        run: |
          v=$(node -p "require('./package.json').version")
          grep -q "const VERSION = '$v'" bin/indianopinion.mjs
          grep -q "IO_SH_VERSION=$v" io.sh
      - name: Tests (CLI and io.sh against the local REST stub)
        run: node --test test/*.test.mjs
      - name: Package contents
        run: npm pack --dry-run
